services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelense-postgres

    environment:
      POSTGRES_DB: codelense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - codelense_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codelense_pg_data: